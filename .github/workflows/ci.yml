name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run OctoCrystal Sanctum verification suite
        run: node projects/octocrystal-sanctum/tests/verify.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python syntax across projects
        run: |
          python3 -m py_compile \
            projects/joybooks-semantic-search/search_engine.py \
            projects/tic-tac-toe-ai/backend/main.py \
            projects/tic-tac-toe-ai/desktop/tic_tac_toe.py

      - name: Verify shell script syntax
        run: bash -n projects/mysql-vector-rag-sandbox/practice.sh
