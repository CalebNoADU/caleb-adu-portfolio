<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <header class="header">
      <h1>Tic Tac Toe</h1>
      <div class="controls-bar">
        <div class="segmented-control" id="mode-select" role="group" aria-label="Game Mode">
          <button type="button" class="seg-btn active" data-mode="ai">vs AI</button>
          <button type="button" class="seg-btn" data-mode="pvp">2 Players</button>
        </div>
        <select id="difficulty-select" aria-label="AI Difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard" selected>Unbeatable</option>
        </select>
      </div>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card player-x active-turn" id="score-card-x">
        <span class="score-label" id="label-x">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score-card draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draw">0</span>
      </div>
      <div class="score-card player-o" id="score-card-o">
        <span class="score-label" id="label-o">AI (O)</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </section>

    <div class="status-banner" id="status-text" aria-live="polite">
      Player X's turn
    </div>

    <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board">
      <button class="cell" data-index="0" aria-label="Row 1, Column 1"></button>
      <button class="cell" data-index="1" aria-label="Row 1, Column 2"></button>
      <button class="cell" data-index="2" aria-label="Row 1, Column 3"></button>
      <button class="cell" data-index="3" aria-label="Row 2, Column 1"></button>
      <button class="cell" data-index="4" aria-label="Row 2, Column 2"></button>
      <button class="cell" data-index="5" aria-label="Row 2, Column 3"></button>
      <button class="cell" data-index="6" aria-label="Row 3, Column 1"></button>
      <button class="cell" data-index="7" aria-label="Row 3, Column 2"></button>
      <button class="cell" data-index="8" aria-label="Row 3, Column 3"></button>
    </div>

    <footer class="actions">
      <button type="button" class="btn btn-primary" id="new-game-btn">New Round</button>
      <button type="button" class="btn btn-secondary" id="reset-scores-btn">Reset Scores</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
